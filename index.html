async function submit(){
  const un=P.ans.filter(x=>x<0).length;if(un&&!confirm(un+" soal belum dijawab. Tetap kirim?"))return;
  P.qt[P.cur]+=(Date.now()-P.tq)/1e3;clearInterval(timer);
  const b=$("#sb");if(b){b.disabled=true;b.textContent="Mengirim…"}
  try{P.res=await gs("submitExam",{exam:exam.id,pc:P.pc,ans:P.ans,qt:P.qt.map(x=>Math.round(x)),dur:Math.round((Date.now()-P.t0)/1e3)});P.step="done"}
  catch(e){alert("Gagal mengirim: "+(e.message||e)+"\nSilakan coba kirim lagi.");P.tq=Date.now();window._force=1;renderAll();return}
  window._force=1;renderAll();scrollTo(0,0);

function topicAgg(rs){const m={};rs.forEach(r=>r.tp.forEach((t,i)=>{m[t]=m[t]||{k:t,c:0,n:0};m[t].n++;m[t].c+=r.ok[i]?1:0}));return Object.values(m).map(t=>({...t,pct:t.c/t.n*100}))}
/* ===== ADMIN ===== */
function exams(){return uniq([exam.id,...results.map(r=>r.exam)])}
function examPick(ex){return `<div class="flex" style="margin-bottom:14px"><span class="mu sm">Ujian:</span><select id="ex" style="max-width:340px">${ex.map(x=>`<option ${x===selExam?"selected":""} value="${esc(x)}">${esc(x===exam.id?exam.title:(results.find(r=>r.exam===x)||{}).examTitle||x)}</option>`).join("")}</select><button class="btn o" id="rf" style="padding:8px 16px">↻ Muat ulang</button><span class="sm mu">${lastLoad?"Diperbarui "+new Date(lastLoad).toLocaleTimeString("id-ID"):""}</span></div>`}
function latest(){const m={};results.filter(r=>r.exam===selExam).sort((a,b)=>a.ts-b.ts).forEach(r=>m[r.pc]=r);return Object.values(m)}
function groupBy(a,f){const m={};a.forEach(x=>(m[f(x)]=m[f(x)]||[]).push(x));return m}
function vDash(){
  const L=latest(),sc=L.map(r=>r.score);if(!L.length)return `<div class="card">Belum ada hasil ujian untuk ujian ini.</div>`;
  const lulus=L.filter(r=>r.score>=70).length,tp=topicAgg(L).sort((a,b)=>a.pct-b.pct);
  const byA=groupBy(L,r=>r.area),byArm=groupBy(L,r=>r.arm);
  const arms=Object.entries(byArm).map(([k,v])=>[k,avg(v.map(r=>r.score)),v.length]).sort((a,b)=>b[1]-a[1]);
  const bk=[[0,40],[40,60],[60,70],[70,85],[85,101]].map(([a,b])=>[`${a}–${Math.min(b-1,100)}`,L.filter(r=>r.score>=a&&r.score<b).length]);
  const nq=L[0].total,qs=Array.from({length:nq},(_,i)=>{const v=L.filter(r=>r.ok.length>i);return{i,t:(L[0].tp||[])[i],p:v.reduce((a,r)=>a+r.ok[i],0)/(v.length||1)*100,tm:avg(v.map(r=>r.qt[i]||0))}}).sort((a,b)=>a.p-b.p);
  const qq=exam.id===selExam?exam.questions:[];
  return `<div class="kp"><div class="kpi"><b>${L.length}</b><span>SA sudah ujian</span></div><div class="kpi"><b>${avg(sc).toFixed(1)}</b><span>Rata-rata skor</span></div><div class="kpi"><b>${Math.round(lulus/L.length*100)}%</b><span>Lulus (≥70)</span></div><div class="kpi"><b>${Math.max(...sc)} / ${Math.min(...sc)}</b><span>Skor tertinggi / terendah</span></div></div>
  <div class="g2"><div class="card"><h3>Rata-rata skor per area</h3>${Object.entries(byA).map(([k,v])=>bar(k,avg(v.map(r=>r.score)),avg(v.map(r=>r.score)).toFixed(1)+" ("+v.length+")")).join("")}<h3 style="margin-top:18px">Sebaran skor</h3>${bk.map(b=>bar(b[0],b[1]/L.length*100,b[1])).join("")}</div>
  <div class="card"><h3>Pemahaman per topik <span class="mu sm">(terlemah di atas)</span></h3>${tp.map(t=>bar(t.k,t.pct,Math.round(t.pct)+"%")).join("")}<p class="sm mu">Insight: fokuskan coaching pada topik berpersentase terendah.</p></div></div>
  <div class="card"><h3>Rata-rata skor per ARM</h3>${arms.map(a=>bar(a[0],a[1],a[1].toFixed(1)+" ("+a[2]+")")).join("")}</div>
  <div class="card"><h3>Soal tersulit (akurasi terendah)</h3><div class="tw"><table><tr><th>No</th><th>Topik</th><th>Soal</th><th>Akurasi</th><th>Rata² waktu</th></tr>${qs.slice(0,8).map(x=>`<tr><td>${x.i+1}</td><td>${esc(x.t)}</td><td style="white-space:normal;min-width:240px">${esc(qq[x.i]?qq[x.i].q:"")}</td><td>${Math.round(x.p)}%</td><td>${fd(x.tm)}</td></tr>`).join("")}</table></div></div>`}
function vPantau(){
  const L=latest(),done=new Set(L.map(r=>r.pc)),T=R.length,pct=a=>a.length?a.filter(r=>done.has(r[3])).length/a.length*100:0;
  const byA=groupBy(R,r=>r[0]),byArm=groupBy(R,r=>r[0]+" · "+r[2]);
  const arms=Object.entries(byArm).sort((a,b)=>pct(a[1])-pct(b[1]));

  <div class="card"><h3>SA yang belum mengerjakan</h3><div class="flex"><select id="pf" style="max-width:260px"><option value="">Semua ARM</option>${uniq(R.map(r=>r[2])).map(a=>`<option>${esc(a)}</option>`).join("")}</select><input type="search" id="pq" placeholder="Cari nama / store…" style="max-width:260px"></div><div id="pl" style="margin-top:12px"></div></div>`}
function bindPantau(){
  const done=new Set(latest().map(r=>r.pc)),f=()=>{const a=$("#pf").value,q=$("#pq").value.toLowerCase(),rows=R.filter(r=>!done.has(r[3])&&(!a||r[2]===a)&&(!q||(r[4]+r[6]).toLowerCase().includes(q)));
    $("#pl").innerHTML=`<p class="sm mu">${rows.length} SA</p><div class="tw" style="max-height:420px"><table><tr><th>Area</th><th>ARM</th><th>Nama</th><th>Kode</th><th>Store</th></tr>${rows.slice(0,300).map(r=>`<tr><td>${r[0]}</td><td>${esc(r[2])}</td><td>${esc(r[4])}</td><td>${r[3]}</td><td>${esc(r[6])}</td></tr>`).join("")}</table></div>`};
  $("#pf").onchange=f;$("#pq").oninput=f;f()}
function vWaktu(){
  const L=latest();if(!L.length)return `<div class="card">Belum ada data waktu.</div>`;const d=L.map(r=>r.dur),fast=L.filter(r=>r.dur<r.total*6).length;
  const bk=[["< 2 mnt",0,120],["2–4 mnt",120,240],["4–7 mnt",240,420],["7–12 mnt",420,720],["> 12 mnt",720,1e9]].map(([k,a,b])=>[k,d.filter(x=>x>=a&&x<b).length]);
  const byA=groupBy(L,r=>r.area),byArm=Object.entries(groupBy(L,r=>r.arm)).map(([k,v])=>[k,avg(v.map(r=>r.dur)),v.length]).sort((a,b)=>a[1]-b[1]);
  const srt=[...L].sort((a,b)=>a.dur-b.dur),row=r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.arm)}</td><td>${fd(r.dur)}</td><td>${r.score}</td></tr>`;
  return `<div class="kp"><div class="kpi"><b>${fd(avg(d))}</b><span>Rata-rata durasi</span></div><div class="kpi"><b>${fd(med(d))}</b><span>Median</span></div><div class="kpi"><b>${fd(Math.min(...d))} / ${fd(Math.max(...d))}</b><span>Tercepat / terlama</span></div><div class="kpi"><b>${fast}</b><span>Terlalu cepat (&lt;6 dtk/soal)</span></div></div>
  <div class="g2"><div class="card"><h3>Sebaran durasi</h3>${bk.map(b=>bar(b[0],b[1]/L.length*100,b[1])).join("")}<h3 style="margin-top:18px">Rata-rata per area</h3>${Object.entries(byA).map(([k,v])=>bar(k,avg(v.map(r=>r.dur))/Math.max(...d)*100,fd(avg(v.map(r=>r.dur))))).join("")}</div>
  <div class="card"><h3>Rata-rata durasi per ARM</h3>${byArm.map(a=>bar(a[0],a[1]/Math.max(...d)*100,fd(a[1]))).join("")}</div></div>
  <div class="g2"><div class="card"><h3>Pengerjaan tercepat <span class="mu sm">(cek indikasi asal jawab)</span></h3><div class="tw"><table><tr><th>Nama</th><th>ARM</th><th>Durasi</th><th>Skor</th></tr>${srt.slice(0,8).map(row).join("")}</table></div></div><div class="card"><h3>Pengerjaan terlama</h3><div class="tw"><table><tr><th>Nama</th><th>ARM</th><th>Durasi</th><th>Skor</th></tr>${srt.slice(-8).reverse().map(row).join("")}</table></div></div></div>`}
function vRaw(){const A=uniq(results.filter(r=>r.exam===selExam).map(r=>r.arm));return `<div class="card"><div class="flex"><select id="ra" style="max-width:200px"><option value="">Semua area</option><option>MC</option><option>TRADI</option></select><select id="rm" style="max-width:240px"><option value="">Semua ARM</option>${A.map(a=>`<option>${esc(a)}</option>`).join("")}</select><input type="search" id="rq" placeholder="Cari nama / kode / store…" style="max-width:260px"><span class="sp"></span><button class="btn o" id="csv">Unduh CSV</button></div><div id="rt" style="margin-top:12px"></div></div>`}
function rawRows(){const a=$("#ra").value,m=$("#rm").value,q=$("#rq").value.toLowerCase();return results.filter(r=>r.exam===selExam&&(!a||r.area===a)&&(!m||r.arm===m)&&(!q||(r.name+r.pc+r.sn).toLowerCase().includes(q))).sort((x,y)=>y.ts-x.ts)}
function bindRaw(){const f=()=>{const rs=rawRows();$("#rt").innerHTML=`<p class="sm mu">${rs.length} baris (semua percobaan)</p><div class="tw" style="max-height:520px"><table><tr><th>Waktu</th><th>Area</th><th>ARM</th><th>Nama</th><th>Personal Code</th><th>Store Code</th><th>Store</th><th>Skor</th><th>Benar</th><th>Durasi</th></tr>${rs.slice(0,500).map(r=>`<tr><td>${new Date(r.ts).toLocaleString("id-ID")}</td><td>${r.area}</td><td>${esc(r.arm)}</td><td>${esc(r.name)}</td><td>${r.pc}</td><td>${r.sc}</td><td>${esc(r.sn)}</td><td><b>${r.score}</b></td><td>${r.correct}/${r.total}</td><td>${fd(r.dur)}</td></tr>`).join("")}</table></div>`};

    try{const u=URL.createObjectURL(new Blob([csv],{type:"text/csv"})),a=document.createElement("a");a.href=u;a.download="raw_"+selExam+".csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){alert("Unduhan gagal.")}}}
/* ===== KELOLA SOAL ===== */
let draft=null,rdraft=null;
function vKelola(){const ae=adminExam||{id:"",title:"",questions:[]};return `<div class="card"><h2>Unggah soal ujian berikutnya</h2><p class="sm mu">File .xlsx / .csv dengan kolom: <b>Soal, A, B, C, D, Kunci</b> (huruf A–D), opsional <b>Topik</b> dan <b>Penjelasan</b>. Jumlah soal bebas. Soal tersimpan di sheet SOAL.</p>
  <label>Judul ujian</label><input type="text" id="kt" placeholder="Contoh: Ujian 2 – Produk Baru Desember"><label>File soal</label><input type="file" id="kf" accept=".xlsx,.xls,.csv"><div id="kp" style="margin-top:12px"></div></div>
  <div class="card"><h2>Perbarui data SA</h2><p class="sm mu">Unggah file produktivitas (sheet <b>SA REGULAR</b>) atau file format sederhana dengan kolom <b>Area, Sub Area, ARM, Personal Code, Nama SA, Store Code, Store Name</b>. Data lama diganti.</p><input type="file" id="rf2" accept=".xlsx,.xls,.csv"><div id="rp" style="margin-top:12px"></div></div>
  <div class="card"><h3>Ganti PIN admin</h3><div class="flex"><input type="text" id="np" placeholder="PIN baru (min. 4 karakter)" style="max-width:260px"><button class="btn o" id="npb">Simpan PIN</button></div></div>
  <div class="card"><h3>Ujian aktif sekarang</h3><p><b>${esc(ae.title||"—")}</b> · ${ae.questions.length} soal · ID <code>${esc(ae.id)}</code> · ${R.length} SA terdaftar</p>
  <div class="tw" style="max-height:320px"><table><tr><th>#</th><th>Topik</th><th>Soal</th><th>Kunci</th></tr>${ae.questions.map((q,i)=>`<tr><td>${i+1}</td><td>${esc(q.t)}</td><td style="white-space:normal;min-width:260px">${esc(q.q)}</td><td>${"ABCD"[q.a]||"?"}</td></tr>`).join("")}</table></div></div>`}
function parseRoster(buf){
  let wb=XLSX.read(buf,{sheets:["SA REGULAR"]}),out=[];
  if(wb.Sheets["SA REGULAR"]){const a=XLSX.utils.sheet_to_json(wb.Sheets["SA REGULAR"],{header:1,defval:""});
    for(let i=2;i<a.length;i++){const r=a[i],pc=String(r[2]).trim(),ar=String(r[18]).trim();if(!pc||!ar||!String(r[17]).trim())continue;const p=ar.split(" - ");out.push([p[0].trim().toUpperCase(),(p[1]||"").trim(),String(r[17]).trim(),pc,String(r[4]).trim(),String(r[6]).trim(),String(r[7]).trim()])}}
  else{wb=XLSX.read(buf);const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
    rows.forEach(r=>{const g=k=>{const key=Object.keys(r).find(x=>x.trim().toLowerCase()===k);return key?String(r[key]).trim():""};
      const row=[g("area").toUpperCase(),g("sub area"),g("arm"),g("personal code"),g("nama sa"),g("store code"),g("store name")];if(row[0]&&row[2]&&row[3]&&row[4])out.push(row)})}
  const m={};out.forEach(r=>m[r[3]]=r);return Object.values(m)}
function bindKelola(){
  $("#kf").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{
    const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""}),qs=[],err=[];
    rows.forEach((r,i)=>{const g=k=>{const key=Object.keys(r).find(x=>x.trim().toLowerCase()===k);return key?String(r[key]).trim():""};
      const o=["a","b","c","d"].map(g),a="ABCD".indexOf(g("kunci").toUpperCase()[0]||"");if(!g("soal"))return;
      if(o.some(x=>!x)||a<0){err.push("Baris "+(i+2)+": opsi/kunci belum lengkap");return}
      qs.push({t:g("topik")||"Umum",q:g("soal"),o,a,e:g("penjelasan")})});
    draft=qs;$("#kp").innerHTML=`<div class="${err.length?"warn":""} sm">${qs.length} soal valid terbaca.${err.length?"<br>"+err.slice(0,5).map(esc).join("<br>"):""}</div>${qs.length?`<button class="btn" id="pub" style="margin-top:10px">Terbitkan sebagai ujian aktif</button>`:""}`;
    if($("#pub"))$("#pub").onclick=async()=>{const t=$("#kt").value.trim();if(!t)return alert("Isi judul ujian dulu.");if(!confirm("Ganti ujian aktif dengan "+draft.length+" soal ini?"))return;
      $("#pub").disabled=true;try{await gs("adminSaveExam",pin,t,draft);const b=await gs("getBoot");exam=b.exam;await loadAdmin();selExam=exam.id;tab="kelola";renderAll();alert("Ujian baru aktif.")}catch(x){alert("Gagal menyimpan: "+(x.message||x));$("#pub").disabled=false}}
  }catch(x){$("#kp").innerHTML=`<div class="warn">File tidak bisa dibaca.</div>`}};

    rdraft=parseRoster(await f.arrayBuffer());const c=k=>rdraft.filter(r=>r[0]===k).length;
    $("#rp").innerHTML=`<div class="sm">${rdraft.length} SA terbaca (MC ${c("MC")}, TRADI ${c("TRADI")}).</div>${rdraft.length?`<button class="btn" id="rpub" style="margin-top:10px">Simpan data SA</button>`:`<div class="warn">Format tidak dikenali.</div>`}`;
    if($("#rpub"))$("#rpub").onclick=async()=>{if(!confirm("Ganti seluruh data SA dengan "+rdraft.length+" baris ini?"))return;$("#rpub").disabled=true;
      try{await gs("adminSaveRoster",pin,rdraft);const b=await gs("getBoot");R=b.roster;renderAll();alert("Data SA tersimpan.")}catch(x){alert("Gagal: "+(x.message||x));$("#rpub").disabled=false}}
  }catch(x){$("#rp").innerHTML=`<div class="warn">File tidak bisa dibaca.</div>`}};
  $("#npb").onclick=async()=>{const n=$("#np").value.trim();try{await gs("adminChangePin",pin,n);pin=n;$("#np").value="";alert("PIN diganti.")}catch(x){alert(x.message||x)}}}
